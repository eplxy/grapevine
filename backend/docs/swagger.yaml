definitions:
  handlers.AutocompleteLocationBiasRectangleDTO:
    properties:
      east:
        type: number
      north:
        type: number
      south:
        type: number
      west:
        type: number
    type: object
  handlers.CreateNoteRequest:
    properties:
      content:
        type: object
      media_urls:
        items:
          type: string
        type: array
      text_content:
        type: string
    required:
    - content
    type: object
  handlers.CreateReviewRequest:
    properties:
      content:
        type: object
      location:
        $ref: '#/definitions/handlers.LocationUpsertInfo'
      media_urls:
        items:
          type: string
        type: array
      rating:
        maximum: 5
        minimum: 1
        type: integer
      text_content:
        type: string
    required:
    - location
    - rating
    type: object
  handlers.LocationAutocompleteRequest:
    properties:
      location_bias:
        $ref: '#/definitions/handlers.AutocompleteLocationBiasRectangleDTO'
      query:
        type: string
    required:
    - query
    type: object
  handlers.LocationAutocompleteResponse:
    properties:
      suggestions:
        items:
          $ref: '#/definitions/models.AutocompleteSuggestion'
        type: array
    type: object
  handlers.LocationUpsertInfo:
    properties:
      address:
        type: string
      google_place_id:
        type: string
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      type:
        type: string
    required:
    - address
    - google_place_id
    - name
    type: object
  handlers.UploadURLResponse:
    properties:
      publicUrl:
        type: string
      signedUrl:
        type: string
    type: object
  handlers.authRequest:
    properties:
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - name
    - password
    type: object
  models.AutocompleteSuggestion:
    properties:
      address:
        description: secondary text from places api response
        type: string
      matches:
        items:
          properties:
            end_offset:
              type: integer
            start_offset:
              type: integer
          type: object
        type: array
      name:
        description: primary text from places api response
        type: string
      place_id:
        type: string
      types:
        items:
          type: string
        type: array
    required:
    - address
    - name
    - place_id
    type: object
  models.FeedItem:
    properties:
      author_id:
        type: integer
      author_name:
        type: string
      content:
        type: object
      created_at:
        type: string
      location_id:
        type: integer
      location_name:
        type: string
      media:
        items:
          $ref: '#/definitions/models.MediaItem'
        type: array
      post_id:
        type: integer
      post_type:
        description: '"note" or "review"'
        type: string
      rating:
        type: integer
      text_content:
        type: string
    type: object
  models.MediaItem:
    properties:
      display_order:
        description: 1-indexed display order
        type: integer
      media_type:
        description: '"image" or "video"'
        type: string
      url:
        type: string
    type: object
  router.PingResponse:
    properties:
      message:
        example: pong
        type: string
    type: object
info:
  contact: {}
  description: API for grapevine application
  title: grapevine API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with their name and password, then return an
        access token and set a refresh token cookie.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Removes the refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Log out of the current user session
      tags:
      - auth
  /auth/me:
    get:
      description: Return the current authenticated user's id and name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user session
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Validate the refresh token cookie and issue a new access token.
      parameters:
      - description: Refresh token cookie value
        in: header
        name: refresh_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with a name and password.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /location/autocomplete:
    post:
      consumes:
      - application/json
      description: Get place predictions based on a text string. Defaults to a circular
        bias around Montreal.
      parameters:
      - description: Autocomplete query and optional rectangular location bias
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LocationAutocompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Google Places Autocomplete response
          schema:
            $ref: '#/definitions/handlers.LocationAutocompleteResponse'
        "400":
          description: Bad Request - Invalid JSON or missing required fields
          schema:
            type: object
        "500":
          description: Internal Server Error - Google Places API failure
          schema:
            type: object
      summary: Autocomplete places
      tags:
      - location
  /media/upload-url:
    get:
      description: Generates a temporary signed URL to upload media directly to Google
        Cloud Storage from the frontend. Returns both the signed URL for the PUT request
        and the future public URL.
      parameters:
      - description: The name of the file (e.g., review-pic.jpg)
        in: query
        name: fileName
        required: true
        type: string
      - description: The exact MIME type of the file (e.g., image/jpeg)
        in: query
        name: contentType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated URLs
          schema:
            $ref: '#/definitions/handlers.UploadURLResponse'
        "400":
          description: Missing fileName or contentType
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to generate upload URL
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Generate GCS signed URL
      tags:
      - media
  /ping:
    get:
      consumes:
      - application/json
      description: Returns pong message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.PingResponse'
      summary: Ping endpoint
      tags:
      - health
  /posts:
    get:
      description: Returns paginated posts for the main feed.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Home Feed
      tags:
      - posts
  /posts/{id}:
    get:
      description: Fetches post details including media and location info.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FeedItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Post by ID
      tags:
      - posts
  /posts/note:
    post:
      consumes:
      - application/json
      description: Create a post not attached to a location.
      parameters:
      - description: Note payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a Note
      tags:
      - posts
  /posts/review:
    post:
      consumes:
      - application/json
      description: Saves Google location data to cache, then creates a review attached
        to it.
      parameters:
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a Review
      tags:
      - posts
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

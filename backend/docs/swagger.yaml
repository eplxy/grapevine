definitions:
  handlers.CreateNoteRequest:
    properties:
      content:
        type: object
      media_urls:
        items:
          type: string
        type: array
      text_content:
        type: string
    required:
    - content
    type: object
  handlers.CreateReviewRequest:
    properties:
      content:
        type: object
      location:
        $ref: '#/definitions/handlers.LocationUpsertInfo'
      media_urls:
        items:
          type: string
        type: array
      rating:
        maximum: 5
        minimum: 1
        type: integer
      text_content:
        type: string
    required:
    - location
    - rating
    type: object
  handlers.LocationUpsertInfo:
    properties:
      address:
        type: string
      google_place_id:
        type: string
      lat:
        type: number
      lng:
        type: number
      location_type:
        type: string
      name:
        type: string
    required:
    - address
    - google_place_id
    - lat
    - lng
    - name
    type: object
  handlers.authRequest:
    properties:
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - name
    - password
    type: object
  models.FeedItem:
    properties:
      author_id:
        type: integer
      author_name:
        type: string
      content:
        type: object
      created_at:
        type: string
      location_id:
        type: integer
      location_name:
        type: string
      media:
        items:
          $ref: '#/definitions/models.MediaItem'
        type: array
      post_id:
        type: integer
      post_type:
        description: '"note" or "review"'
        type: string
      rating:
        type: integer
      text_content:
        type: string
    type: object
  models.MediaItem:
    properties:
      media_type:
        description: '"image" or "video"'
        type: string
      url:
        type: string
    type: object
  router.PingResponse:
    properties:
      message:
        example: pong
        type: string
    type: object
info:
  contact: {}
  description: API for grapevine application
  title: grapevine API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with their name and password, then return an
        access token and set a refresh token cookie.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Removes the refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Log out of the current user session
      tags:
      - auth
  /auth/me:
    get:
      description: Return the current authenticated user's id and name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user session
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Validate the refresh token cookie and issue a new access token.
      parameters:
      - description: Refresh token cookie value
        in: header
        name: refresh_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with a name and password.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /ping:
    get:
      consumes:
      - application/json
      description: Returns pong message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.PingResponse'
      summary: Ping endpoint
      tags:
      - health
  /posts:
    get:
      description: Returns paginated posts for the main feed.
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Home Feed
      tags:
      - posts
  /posts/{id}:
    get:
      description: Fetches post details including media and location info.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FeedItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Post by ID
      tags:
      - posts
  /posts/note:
    post:
      consumes:
      - application/json
      description: Create a post not attached to a location.
      parameters:
      - description: Note payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a Note
      tags:
      - posts
  /posts/review:
    post:
      consumes:
      - application/json
      description: Saves Google location data to cache, then creates a review attached
        to it.
      parameters:
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a Review
      tags:
      - posts
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
